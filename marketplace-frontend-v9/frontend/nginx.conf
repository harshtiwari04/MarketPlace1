# SPA + same-origin API proxy. With this, cookies are first-party and CLIENT_URL on the API can be
# just this host. Set API_UPSTREAM via `envsubst` or replace the placeholder at deploy time.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Hashed assets can be cached forever; index.html must not be.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # API + sitemap proxied to the backend so everything is one origin.
  location /api/ {
    proxy_pass http://API_UPSTREAM;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /sitemap.xml { proxy_pass http://API_UPSTREAM/sitemap.xml; }

  location / { try_files $uri $uri/ /index.html; }
}
